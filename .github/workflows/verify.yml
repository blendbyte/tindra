name: Verify

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  action-pins:
    name: Workflow safeguards
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Test workflow safeguards
        run: bun test scripts/check-action-pins.test.ts scripts/workflow-gates.test.ts
      - name: Require immutable action references
        run: bun scripts/check-action-pins.ts

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tindra
          POSTGRES_PASSWORD: tindra
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Create UI stub for embed
        run: mkdir -p internal/ui/dist && printf '<!doctype html>' > internal/ui/dist/index.html
      - name: Run tests
        env:
          TINDRA_TEST_DSN: postgres://tindra:tindra@localhost:5432/postgres?sslmode=disable
        run: go test -race -p 8 -coverprofile=coverage.out -covermode=atomic ./...
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: false
      - name: Create UI stub for embed
        run: mkdir -p internal/ui/dist && printf '<!doctype html>' > internal/ui/dist/index.html
      - uses: golangci/golangci-lint-action@1e7e51e771db61008b38414a730f564565cf7c20 # v9.2.0
        with:
          version: latest

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tindra
          POSTGRES_PASSWORD: tindra
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tindra:tindra@localhost:5432/postgres?sslmode=disable
      BIND_ADDR: 127.0.0.1:18080
      DISABLE_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Type check and build
        working-directory: web
        run: bun run build
      - name: Build app with embedded frontend
        run: go build -o bin/tindra ./cmd/tindra
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          DATA_DIR: ${{ runner.temp }}/tindra-browser-data
        working-directory: web
        run: bun run test:e2e
      - name: Preserve browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: browser-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: web-dist
          path: internal/ui/dist/
          if-no-files-found: error

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Run tests with coverage
        working-directory: web
        run: bun run test:coverage
      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v6
        with:
          files: web/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
