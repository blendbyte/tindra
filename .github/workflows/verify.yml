name: Verify

on:
  workflow_call:
    secrets:
      CODECOV_TOKEN:
        required: false

permissions:
  contents: read

jobs:
  action-pins:
    name: Workflow safeguards
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - name: Test workflow safeguards
        run: bun test scripts/check-action-pins.test.ts scripts/workflow-gates.test.ts
      - name: Test scripts and repository style
        run: bun test scripts/install.test.ts scripts/backup.test.ts scripts/makefile.test.ts scripts/style.test.ts
      - name: Require immutable action references
        run: bun scripts/check-action-pins.ts

  go-test:
    name: Go tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tindra
          POSTGRES_PASSWORD: tindra
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create UI stub for embed
        run: mkdir -p internal/ui/dist && printf '<!doctype html>' > internal/ui/dist/index.html
      - name: Run tests
        env:
          TINDRA_TEST_DSN: postgres://tindra:tindra@localhost:5432/postgres?sslmode=disable
        run: go test -race -p 8 -coverprofile=coverage.out -covermode=atomic ./...
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: coverage.out
          flags: go
          token: ${{ secrets.CODECOV_TOKEN }}

  go-lint:
    name: Go lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Create UI stub for embed
        run: mkdir -p internal/ui/dist && printf '<!doctype html>' > internal/ui/dist/index.html
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.15.0

  go-vuln:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Create UI stub for embed
        run: mkdir -p internal/ui/dist && printf '<!doctype html>' > internal/ui/dist/index.html
      # Also scans the standard library of the toolchain pinned in go.mod, so a
      # stale Go patch version fails here instead of shipping in a release.
      - name: Run govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...

  frontend:
    name: Frontend build and browser tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: tindra
          POSTGRES_PASSWORD: tindra
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://tindra:tindra@localhost:5432/postgres?sslmode=disable
      BIND_ADDR: 127.0.0.1:18080
      DISABLE_VERSION_CHECK: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Type check and build
        working-directory: web
        run: bun run build
      - name: Build app with embedded frontend
        run: go build -o bin/tindra ./cmd/tindra
      - name: Install Chromium
        working-directory: web
        run: bunx playwright install --with-deps chromium
      - name: Run browser tests
        env:
          DATA_DIR: ${{ runner.temp }}/tindra-browser-data
        working-directory: web
        run: bun run test:e2e
      - name: Preserve browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-test-results
          path: web/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: internal/ui/dist/
          if-no-files-found: error

  frontend-test:
    name: Frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: web/package.json
      - name: Install dependencies
        working-directory: web
        run: bun install --frozen-lockfile
      - name: Lint
        working-directory: web
        run: bun run lint
      - name: Run tests with coverage
        working-directory: web
        run: bun run test:coverage
      - uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: web/coverage/coverage-final.json
          flags: frontend
          token: ${{ secrets.CODECOV_TOKEN }}
