name: Bug report
description: Something is broken or behaving unexpectedly
labels: ["bug"]
body:
  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of Tindra is affected?
      options:
        - Ingest (SDK events not arriving or malformed)
        - Issue tracking (grouping, fingerprinting, merging)
        - Performance monitoring (N+1 detection, transactions)
        - Alerts (email, Slack, Discord, webhook)
        - UI (frontend display or interaction)
        - Self-hosting / Docker setup
        - Other
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Configure ...
        2. Send event / open page ...
        3. See ...
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      placeholder: |
        Tindra version:
        Deployment: Docker / binary
        Postgres version:
        SDK name + version (if ingest-related):
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error output
      description: Run Tindra with `LOG_LEVEL=debug` for more detail.
      render: text
