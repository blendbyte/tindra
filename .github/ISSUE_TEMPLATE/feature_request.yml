name: Feature request
description: Suggest something new or an improvement to existing behaviour
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Before opening a feature request, take a look at the [README](../README.md)
        to get a feel for what Tindra is and isn't trying to be.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the situation you're in and why the current behaviour falls short.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What would you like to see? Rough sketches or examples are welcome.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you've considered
      description: Any other approaches you've thought about or tried?

  - type: dropdown
    id: willing_to_pr
    attributes:
      label: Would you be willing to open a PR for this?
      options:
        - "Yes"
        - "Maybe, with guidance"
        - "No"
    validations:
      required: true
