version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          - errcheck
      - linters:
          - errcheck
        text: "Error return value of `\\(\\*encoding/json\\.Encoder\\)\\.Encode` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Close` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Rollback` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Flush` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `fmt\\.Fprint"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Write` is not checked"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blendbyte/tindra

issues:
  max-same-issues: 0
