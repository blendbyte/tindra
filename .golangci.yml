version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - copyloopvar
    - misspell
    - noctx
    - revive
    - unconvert
  settings:
    revive:
      rules:
        - name: exported
          disabled: true
  exclusions:
    rules:
      - path: _test\.go
        linters:
          - bodyclose
          - noctx
          - errcheck
      # On Go 1.26.4+ staticcheck stops recognising t.Fatal as terminating, so
      # every "if x == nil { t.Fatal(...) }" guard is followed by what it reads
      # as a nil dereference. The guards are correct and CI's Go 1.26.3 reports
      # none of this, so keep the rule off test files rather than rewriting them.
      - path: _test\.go
        text: "SA5011"
        linters:
          - staticcheck
      - linters:
          - errcheck
        text: "Error return value of `\\(\\*encoding/json\\.Encoder\\)\\.Encode` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Close` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Rollback` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Flush` is not checked"
      - linters:
          - errcheck
        text: "Error return value of `fmt\\.Fprint"
      - linters:
          - errcheck
        text: "Error return value of `.+\\.Write` is not checked"

formatters:
  enable:
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/blendbyte/tindra

issues:
  max-same-issues: 0
